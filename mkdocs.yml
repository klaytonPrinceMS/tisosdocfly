site_name: T! SOS DocFly
site_description: Projeto Python modular com NiceGUI, Poetry 3.13 e um banco independente por módulo.
docs_dir: docs
site_dir: site

extra_css:
  - stylesheets/extra.css

theme:
  # Mesmo tema da intranet: readthedocs, em português.
  name: readthedocs
  language: pt

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  # Declarar `plugins:` desliga o padrão; `search` precisa ser nomeado.
  - search
  - mkdocstrings:
      handlers:
        python:
          # O código vive em `src/`; sem isto o griffe não acha os `mod_*`.
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source

