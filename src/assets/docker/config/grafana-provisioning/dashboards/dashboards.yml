# =============================================================================
# Grafana Dashboards Provisioning - Skyrover Modular
# =============================================================================
# Configuração automática dos dashboards no Grafana.
# Os dashboards são carregados a partir da pasta /var/lib/grafana/dashboards.
# =============================================================================

apiVersion: 1

providers:
  - name: 'Skyrover Dashboards'
    orgId: 1
    folder: 'Skyrover'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards